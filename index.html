<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aesthetics</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="title">Aesthetics</h1>
    <p id="subtitle" class="hint"></p>
  </div>
  <div class="topbtns">
    <button id="plainbtn" data-act="plain" title="Give the editor a neutral room when an aesthetic is too loud to work inside">Plain room</button>
    <button id="darkbtn" data-act="dark" hidden>After dark</button>
    <button id="revert" data-act="revert" hidden>Revert to file</button>
    <button id="deletebtn" data-act="delete" hidden>Delete</button>
    <button data-act="fork">Fork</button>
    <button data-act="import">Import</button>
    <button data-act="new">New</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<div class="cols">
  <!-- The rack's grip. Only exists on a phone, where .cols becomes a bottom
       sheet; display:none everywhere else. -->
  <button class="grip" data-act="rack" aria-label="Resize the controls"><span class="grip-label">Controls</span><span class="grip-arrow">▲</span></button>

  <nav id="list" class="col-list" aria-label="Aesthetics"></nav>

  <main id="form" class="col-form"></main>

  <aside class="col-side">
    <!-- The demo: a small site that never changes shape — the aesthetic is
         what changes. Everything with data-stag arrives with the entrance. -->
    <section id="demo" class="demo">
      <div class="pv-room">
        <nav class="pv-bar" data-stag>
          <span class="pv-brand pv-name">—</span>
          <span class="pv-links">
            <a class="pv-link" href="#demo">Rooms</a>
            <a class="pv-link" href="#demo">Letters</a>
          </span>
          <button class="pv-btn pv-primary">Begin</button>
        </nav>

        <section class="pv-hero" data-stag>
          <h2 class="pv-h1">A room in this place</h2>
          <p class="pv-tagline">—</p>
          <p class="pv-story"></p>
          <div class="pv-chips"></div>
          <div class="pv-row">
            <button class="pv-btn pv-primary">Keep it</button>
            <button class="pv-btn">Not today</button>
            <a class="pv-link" href="#demo">or read on</a>
          </div>
        </section>

        <div class="pv-grid">
          <article class="pv-card" data-stag>
            <h3 class="pv-h3">First</h3>
            <p class="pv-card-copy" data-fallback="A card with something worth keeping on it."></p>
          </article>
          <article class="pv-card" data-stag>
            <h3 class="pv-h3">Second</h3>
            <p class="pv-card-copy" data-fallback="Another, arriving a beat behind the first."></p>
          </article>
          <article class="pv-card" data-stag>
            <h3 class="pv-h3">Third</h3>
            <p class="pv-card-copy" data-fallback="The stagger you can feel is the Motion section."></p>
          </article>
        </div>

        <form class="pv-form" data-stag onsubmit="return false">
          <input class="pv-input" placeholder="Something typed here">
          <button class="pv-btn pv-primary">Send</button>
        </form>

        <div class="pv-divider" data-stag><span class="pv-orn"></span></div>

        <footer class="pv-footer" data-stag>
          <span class="pv-name">—</span>
          <span class="pv-mono">every pixel above is a token</span>
        </footer>

        <div class="pv-toast" data-stag>On the list</div>
      </div>
      <div class="demobar">
        <div class="pv-swatches"></div>
        <button class="mini" data-act="replay" title="Run the entrance again">↻ Entrance</button>
      </div>
    </section>

    <section class="export">
      <div class="tabs">
        <button data-tab="guide">Guide</button>
        <button data-tab="json">JSON</button>
        <button data-tab="css">CSS</button>
        <button data-tab="tokens">Tokens</button>
        <span class="spacer"></span>
        <button class="mini" data-act="copy">Copy</button>
        <button class="mini" data-act="download">Download</button>
      </div>
      <textarea id="out" class="mono" readonly spellcheck="false"></textarea>
      <p class="hint">The JSON is the aesthetic. Commit it to <code>library/</code>
        (or hand it to a session) and it is kept; the guide is the same thing written
        out for reading.</p>
    </section>
  </aside>
</div>

<script type="module" src="js/editor.js"></script>
</body>
</html>

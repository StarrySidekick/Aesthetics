# Publishes the studio to GitHub Pages on every push to main, at
# https://starrysidekick.github.io/Aesthetics/.
#
# Same deploy shape as Activinator's: assemble the site and force-push it to
# the gh-pages branch, which Pages serves. Pushing a gh-pages branch enables
# Pages by itself — the artifact flow needs an admin-only API call the
# workflow token isn't allowed. The branch is entirely generated: never
# commit to it, never base anything on it.
#
# This is a project site, so it shares the starrysidekick.github.io origin
# with Bureau and Activinator. The studio has no service worker and must not
# grow one casually — a cache store belongs to the origin, and that origin
# has been wiped by a careless worker once already (see Activinator's README).
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site is the studio and its library: everything except the tooling.
      - name: Assemble and push the site
        run: |
          mkdir -p _site
          cp -r css js library index.html _site/
          # dist/ is what the other repos vendor from — see docs/CONSUMING.md.
          # It is committed, so there is nothing to build here; but it is
          # verified, because publishing a distribution that no longer matches
          # the library it claims to come from is the failure worth catching.
          node scripts/dist.mjs --check
          cp -r dist _site/
          touch _site/.nojekyll
          cd _site
          git init -b gh-pages
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
